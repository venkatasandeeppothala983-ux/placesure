# Selected default: one FREE Render web service + your EXISTING external MySQL.
# This file does not provision MySQL. You must supply a suitable existing database,
# import database/database.sql once, and use the provider's required TLS settings.
# Use this root render.yaml in Render Blueprint setup. No paid database is created.
services:
  - type: web
    name: placesure
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    envVars:
      - key: BIND_HOST
        value: 0.0.0.0
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_WAIT_SECONDS
        value: '0'
      - key: SEED_DEMO
        value: 'true'
